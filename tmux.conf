# -- general -------------------------------------------------------------------

# set C-a as prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# set default terminal
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:RGB"

# set vi keys
set -g status-keys vi
setw -g mode-keys vi

# faster command sequences
set -s escape-time 10

# increase repeat timeout
set -sg repeat-time 600

# how long status messages and pane indicators stay visible
set -g display-time 2000
set -g display-panes-time 2000

# focus events
set -s focus-events on

# history
set -g history-limit 50000

# mouse support
set -g mouse on

# start with window 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1

# activity monitoring
set -g monitor-activity on
set -g visual-activity off
set -g bell-action any

# renumber windows when one is closed
set -g renumber-windows on

# after kill-session, switch to another session instead of detaching
set -g detach-on-destroy off

# automatically set window title
set -g set-titles on
set -g set-titles-string "#S · #W"

# extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# default pipe target for copy commands (used by tmux-yank)
set -g copy-command "pbcopy"

# -- bindings ------------------------------------------------------------------

# reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# horizontal splitting
bind | split-window -h -c "#{pane_current_path}"

# vertical splitting
bind _ split-window -v -c "#{pane_current_path}"

# open new window in current path
bind c new-window -c "#{pane_current_path}"

# kill panes and windows
bind q kill-pane
bind Q kill-window

# zoom pane
bind z resize-pane -Z

# break pane into new window
bind ! break-pane

# join pane from another window (J; lowercase j is pane-down)
bind J command-prompt -p "Join pane from:" "join-pane -s '%%'"

# send current pane into another window (pairs with J)
bind @ command-prompt -p "Send pane to window:" "join-pane -t '%%'"

# moving between windows
bind -r < swap-window -t -1
bind -r > swap-window -t +1

# toggle between the two most recent windows (the old default `prefix l`,
# which the pane-nav bindings above replaced)
bind -r Tab last-window

# move current window to position: prefix m, then 1-9 (any other key cancels)
# browser-style: if a window occupies position N it and everything after it
# shift +1 and the current window takes N; if N is beyond the last window,
# the current window moves to the end. Renumbering runs before (tmux's -b
# insert misbehaves on gapped indices) and after (to close the shift gap).
# (uses a custom table name: tmux 3.8 has a native `move` table for floating
# pane placement, with digits 1-4 bound — don't clobber it)
bind m switch-client -T mwin
bind -T mwin 1 switch-client -T root \; move-window -r \; if-shell -F '#{e|>:1,#{session_windows}}' 'move-window -t 1' 'move-window -b -t 1' \; move-window -r
bind -T mwin 2 switch-client -T root \; move-window -r \; if-shell -F '#{e|>:2,#{session_windows}}' 'move-window -t 2' 'move-window -b -t 2' \; move-window -r
bind -T mwin 3 switch-client -T root \; move-window -r \; if-shell -F '#{e|>:3,#{session_windows}}' 'move-window -t 3' 'move-window -b -t 3' \; move-window -r
bind -T mwin 4 switch-client -T root \; move-window -r \; if-shell -F '#{e|>:4,#{session_windows}}' 'move-window -t 4' 'move-window -b -t 4' \; move-window -r
bind -T mwin 5 switch-client -T root \; move-window -r \; if-shell -F '#{e|>:5,#{session_windows}}' 'move-window -t 5' 'move-window -b -t 5' \; move-window -r
bind -T mwin 6 switch-client -T root \; move-window -r \; if-shell -F '#{e|>:6,#{session_windows}}' 'move-window -t 6' 'move-window -b -t 6' \; move-window -r
bind -T mwin 7 switch-client -T root \; move-window -r \; if-shell -F '#{e|>:7,#{session_windows}}' 'move-window -t 7' 'move-window -b -t 7' \; move-window -r
bind -T mwin 8 switch-client -T root \; move-window -r \; if-shell -F '#{e|>:8,#{session_windows}}' 'move-window -t 8' 'move-window -b -t 8' \; move-window -r
bind -T mwin 9 switch-client -T root \; move-window -r \; if-shell -F '#{e|>:9,#{session_windows}}' 'move-window -t 9' 'move-window -b -t 9' \; move-window -r
bind -T mwin Any switch-client -T root

# moving between panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Alt + arrow to switch windows
# note: with Ghostty's default (macos-option-as-alt off), option+left/right
# arrive as ESC b / ESC f, so the M-b/M-f bindings are the ones that fire;
# M-Left/M-Right only fire with macos-option-as-alt=true. Either way these
# hijack option+left/right word-motion in the shell.
bind -n M-Left previous-window
bind -n M-b previous-window
bind -n M-Right next-window
bind -n M-f next-window

# toggle synchronize-panes (type into all panes at once)
bind S set -w synchronize-panes \; display "sync: #{?pane_synchronized,on,off}"

# floating scratch shell in the current directory (exit closes it)
bind t display-popup -d "#{pane_current_path}" -w 80% -h 75% -E

# fzf pickers (replace the built-in choose-tree for s/w)
bind s display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs -r tmux switch-client -t"
bind w display-popup -E "tmux list-windows -a -F '#{session_name}:#{window_index}: #{window_name}' | fzf --reverse | cut -d: -f1-2 | xargs -r tmux switch-client -t"

# clipboard: `y` and mouse-drag yank are provided by tmux-yank
# (uses copy-command above)

# -- plugins -------------------------------------------------------------------

# tpm
set -g @plugin 'tmux-plugins/tpm'

# persist tmux environment across system restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'

# continuous saving of tmux environment
set -g @plugin 'tmux-plugins/tmux-continuum'

# restore sessions automatically when the tmux server starts
set -g @continuum-restore 'on'

# save and restore pane contents too
set -g @resurrect-capture-pane-contents 'on'

# copying text to the system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# -- theme ---------------------------------------------------------------------
if '[ -f ~/.config/tmux/tmux.theme ]' 'source ~/.config/tmux/tmux.theme'

# run tpm
run '~/.tmux/plugins/tpm/tpm'
